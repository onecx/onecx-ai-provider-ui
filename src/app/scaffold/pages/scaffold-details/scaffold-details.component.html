<ocx-portal-page
  permission="SCAFFOLD#VIEW"
  [helpArticleId]="'SCAFFOLD_DETAILS.HELP_ARTICLE_ID' | translate"
  *ngrxLet="viewModel$; let vm"
>
  <ocx-page-header
    [header]="'SCAFFOLD_DETAILS.HEADER' | translate"
    [subheader]="'SCAFFOLD_DETAILS.SUB_HEADER' | translate"
    [actions]="(headerActions$ | async) ?? []"
    [disableDefaultActions]="true"
    [manualBreadcrumbs]="true"
  >
  </ocx-page-header>
  <ocx-content>
    <div class="surface-section mt-3 mb-1 mx-3">
      <form [formGroup]="formGroup">
        <div class="mt-3 mb-1">
          <p-floatlabel variant="on" controlErrorAnchor>
            <input
              pInputText
              type="text"
              id="scaffold_detail_name"
              class="w-full pt-3 pb-2 text-responsive"
              formControlName="name"
            />
            <label class="ocx-required-label" for="scaffold_detail_name">
              {{ 'SCAFFOLD_DETAILS.FORM.NAME' | translate }}
            </label>
          </p-floatlabel>
        </div>
        <div class="mt-3 mb-1">
          <p-floatlabel variant="on" controlErrorAnchor>
            <input
              pInputText
              type="text"
              id="scaffold_detail_sourceProduct"
              class="w-full pt-3 pb-2 text-responsive"
              formControlName="sourceProduct"
            />
            <label for="scaffold_detail_sourceProduct">
              {{ 'SCAFFOLD_DETAILS.FORM.SOURCE_PRODUCT' | translate }}
            </label>
          </p-floatlabel>
        </div>
        <div class="mt-3 mb-1">
          <p-floatlabel variant="on" controlErrorAnchor>
            <textarea
              pTextarea
              id="scaffold_detail_systemPrompt"
              class="w-full"
              rows="8"
              formControlName="systemPrompt"
            ></textarea>
            <label for="scaffold_detail_systemPrompt">
              {{ 'SCAFFOLD_DETAILS.FORM.SYSTEM_PROMPT' | translate }}
            </label>
          </p-floatlabel>
        </div>
        <div class="mt-3 mb-1" *ngIf="vm.details?.skills && vm.details!.skills!.length > 0">
          <span class="font-semibold mb-2 block">{{ 'SCAFFOLD_DETAILS.FORM.SKILLS' | translate }}</span>
          <div class="flex flex-column gap-2">
            <div
              *ngFor="let skill of vm.details?.skills"
              class="surface-card border-1 border-round p-3"
            >
              <span class="font-medium">{{ skill.name }}</span>
            </div>
          </div>
        </div>
      </form>
    </div>
  </ocx-content>
</ocx-portal-page>
