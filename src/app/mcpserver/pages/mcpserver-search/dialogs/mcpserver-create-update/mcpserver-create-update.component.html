<form [formGroup]="formGroup" [attr.aria-label]="'MCPSERVER_CREATE_UPDATE.FORM.NAME' | translate">
  <div class="flex flex-wrap flex-column gap-4 justify-content-between mt-2">
    <div [title]="'MCPSERVER_CREATE_UPDATE.FORM.NAME' | translate">
      <p-floatlabel variant="on" controlErrorAnchor>
        <input
          pInputText
          type="text"
          id="mcpserver_create_update_form_name"
          class="w-full pt-3 pb-2 text-responsive"
          formControlName="name"
          required
          aria-required="true"
        />
        <label class="ocx-required-label" for="mcpserver_create_update_form_name">
          {{ 'MCPSERVER_CREATE_UPDATE.FORM.NAME' | translate }}
        </label>
      </p-floatlabel>
    </div>
    <div [title]="'MCPSERVER_CREATE_UPDATE.FORM.DESCRIPTION' | translate">
      <p-floatlabel variant="on" controlErrorAnchor>
        <input
          pInputText
          type="text"
          id="mcpserver_create_update_form_description"
          class="w-full pt-3 pb-2 text-responsive"
          formControlName="description"
        />
        <label for="mcpserver_create_update_form_description">
          {{ 'MCPSERVER_CREATE_UPDATE.FORM.DESCRIPTION' | translate }}
        </label>
      </p-floatlabel>
    </div>
  </div>
</form>
