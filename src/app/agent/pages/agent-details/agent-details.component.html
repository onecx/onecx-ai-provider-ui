<ocx-portal-page
  permission="AGENT#VIEW"
  [helpArticleId]="'AGENT_DETAILS.HELP_ARTICLE_ID' | translate"
  *ngrxLet="viewModel$; let vm"
>
  @if (vm.detailsLoadingIndicator) {
  <ocx-loading-indicator> </ocx-loading-indicator>
  } @if (!vm.detailsLoaded && !vm.detailsLoadingIndicator) {
  <ocx-error> </ocx-error>
  } @if (vm.detailsLoaded && !vm.detailsLoadingIndicator) {
  <div>
    <ocx-page-header
      [header]="'AGENT_DETAILS.HEADER' | translate"
      [subheader]="'AGENT_DETAILS.SUB_HEADER' | translate"
      [attr.aria-label]="'AGENT_DETAILS.HEADER' | translate"
      [objectDetails]="(objectDetails$ | async) ?? []"
      [actions]="(headerActions$ | async) ?? []"
      [disableDefaultActions]="true"
      [manualBreadcrumbs]="true"
    >
    </ocx-page-header>
    <ocx-content [attr.aria-label]="'AGENT_DETAILS.ARIA_LABEL' | translate">
      <div class="surface-section mt-3 mb-1 mx-3">
        <form [formGroup]="formGroup" class="flex flex-column gap-4" errorTailor>
          <p-tabView>
            <p-tabPanel [header]="'AGENT_DETAILS.TABS.GENERAL' | translate">
              <div class="flex flex-column gap-4 mt-3">
                <p-floatlabel variant="on" controlErrorAnchor>
                  <input
                    pInputText
                    type="text"
                    id="agent_detail_name"
                    class="w-full pt-3 pb-2 text-responsive"
                    formControlName="name"
                    required
                    aria-required="true"
                  />
                  <label class="ocx-required-label" for="agent_detail_name">
                    {{ 'AGENT_DETAILS.FORM.NAME' | translate }}
                  </label>
                </p-floatlabel>

                <p-floatlabel variant="on" controlErrorAnchor>
                  <textarea
                    pInputText
                    id="agent_detail_description"
                    class="w-full pt-3 pb-2 text-responsive"
                    rows="3"
                    formControlName="description"
                  ></textarea>
                  <label for="agent_detail_description">
                    {{ 'AGENT_DETAILS.FORM.DESCRIPTION' | translate }}
                  </label>
                </p-floatlabel>

                <p-floatlabel variant="on" controlErrorAnchor>
                  <textarea
                    pInputText
                    id="agent_detail_additional_prompt"
                    class="w-full pt-3 pb-2 text-responsive"
                    rows="4"
                    formControlName="additionalPrompt"
                  ></textarea>
                  <label for="agent_detail_additional_prompt">
                    {{ 'AGENT_DETAILS.FORM.ADDITIONAL_PROMPT' | translate }}
                  </label>
                </p-floatlabel>

                <p-floatlabel variant="on" controlErrorAnchor>
                  <p-select
                    id="agent_detail_provider"
                    formControlName="provider"
                    [options]="vm.providers"
                    [optionLabel]="'name'"
                    [filter]="true"
                    [showClear]="true"
                    class="w-full"
                    (onChange)="onProviderChanged()"
                  >
                  </p-select>
                  <label for="agent_detail_provider">
                    {{ 'AGENT_DETAILS.FORM.PROVIDER' | translate }}
                  </label>
                </p-floatlabel>

                <p-floatlabel variant="on" controlErrorAnchor>
                  <p-select
                    id="agent_detail_model"
                    formControlName="model"
                    [options]="getFilteredModels(vm.models)"
                    [optionLabel]="'name'"
                    [filter]="true"
                    [showClear]="true"
                    class="w-full"
                  >
                  </p-select>
                  <label for="agent_detail_model">
                    {{ 'AGENT_DETAILS.FORM.MODEL' | translate }}
                  </label>
                </p-floatlabel>

                <p-floatlabel variant="on" controlErrorAnchor>
                  <p-select
                    id="agent_detail_scaffold"
                    formControlName="scaffold"
                    [options]="vm.scaffolds"
                    [optionLabel]="'name'"
                    [filter]="true"
                    [showClear]="true"
                    class="w-full"
                  >
                  </p-select>
                  <label for="agent_detail_scaffold">
                    {{ 'AGENT_DETAILS.FORM.SCAFFOLD' | translate }}
                  </label>
                </p-floatlabel>

                <p-floatlabel variant="on" controlErrorAnchor>
                  <p-multiSelect
                    id="agent_detail_tools"
                    formControlName="tools"
                    [options]="vm.tools"
                    [optionLabel]="'name'"
                    [filter]="true"                    
                    class="w-full"
                  >
                  </p-multiSelect>
                  <label for="agent_detail_tools">
                    {{ 'AGENT_DETAILS.FORM.ADDITIONAL_TOOLS' | translate }}
                  </label>
                </p-floatlabel>
              </div>
            </p-tabPanel>

            <p-tabPanel [header]="'AGENT_DETAILS.TABS.ASSIGNMENTS' | translate">
              <div class="flex flex-column gap-3 mt-3">
                <h3 class="m-0 text-lg font-semibold text-900">
                  {{ 'AGENT_DETAILS.ASSIGNMENTS.GROUPS_SECTION' | translate }}
                </h3>

                <p-floatlabel variant="on" controlErrorAnchor>
                  <p-multiSelect
                    id="agent_detail_groups"
                    formControlName="groups"
                    [options]="vm.groups"
                    [optionLabel]="'name'"
                    [filter]="true"                    
                    class="w-full"
                  >
                  </p-multiSelect>
                  <label for="agent_detail_groups">
                    {{ 'AGENT_DETAILS.ASSIGNMENTS.GROUPS' | translate }}
                  </label>
                </p-floatlabel>

                <div class="flex align-items-center gap-2">
                  <p-floatlabel variant="on" controlErrorAnchor class="flex-1">
                    <input
                      pInputText
                      type="text"
                      id="agent_detail_new_group_name"
                      class="w-full pt-3 pb-2 text-responsive"
                      formControlName="newGroupName"
                    />
                    <label for="agent_detail_new_group_name">
                      {{ 'AGENT_DETAILS.ASSIGNMENTS.NEW_GROUP_NAME' | translate }}
                    </label>
                  </p-floatlabel>
                  <button
                    pButton
                    type="button"
                    class="flex-shrink-0"
                    icon="pi pi-plus"
                    [disabled]="!vm.editMode"
                    (click)="createGroupInPlace()"
                  >
                    {{ 'AGENT_DETAILS.ASSIGNMENTS.CREATE_GROUP' | translate }}
                  </button>
                </div>

                <h3 class="mt-2 mb-0 text-lg font-semibold text-900">
                  {{ 'AGENT_DETAILS.ASSIGNMENTS.FILTERS_SECTION' | translate }}
                </h3>

                <div class="flex justify-content-end">
                  <button
                    pButton
                    type="button"
                    icon="pi pi-plus"
                    [disabled]="!vm.editMode"
                    (click)="addFilter()"
                  >
                    {{ 'AGENT_DETAILS.ASSIGNMENTS.ADD_FILTER' | translate }}
                  </button>
                </div>

                <div formArrayName="filters" class="flex flex-column gap-2">
                  <div
                    class="flex align-items-center gap-2 flex-wrap"
                    *ngFor="let filterGroup of filtersFormArray.controls; let i = index"
                    [formGroupName]="i"
                  >
                    <div style="flex: 1 1 14rem; min-width: 14rem">
                      <p-autoComplete
                        formControlName="key"
                        [suggestions]="filterKeySuggestions"
                        (completeMethod)="searchFilterKeys($any($event))"
                        [dropdown]="true"
                        [inputId]="'agent_detail_filter_key_' + i"
                        class="w-full"
                        [forceSelection]="true"
                      ></p-autoComplete>
                    </div>
                    <span class="font-medium">:</span>
                    <p-floatlabel variant="on" controlErrorAnchor class="flex-1" style="flex: 2 1 20rem; min-width: 18rem">
                      <input
                        pInputText
                        type="text"
                        [id]="'agent_detail_filter_value_' + i"
                        class="w-full pt-3 pb-2 text-responsive"
                        formControlName="value"
                      />
                      <label [for]="'agent_detail_filter_value_' + i">
                        {{ 'AGENT_DETAILS.ASSIGNMENTS.FILTER_VALUE' | translate }}
                      </label>
                    </p-floatlabel>
                    <button
                      pButton
                      type="button"
                      icon="pi pi-trash"
                      severity="danger"
                      [text]="true"
                      [attr.aria-label]="'AGENT_DETAILS.ASSIGNMENTS.REMOVE_FILTER' | translate"
                      [disabled]="!vm.editMode"
                      (click)="removeFilter(i)"
                    >
                      <span class="hidden">{{ 'AGENT_DETAILS.ASSIGNMENTS.REMOVE_FILTER' | translate }}</span>
                    </button>
                  </div>
                </div>
              </div>
            </p-tabPanel>
          </p-tabView>
        </form>
      </div>
    </ocx-content>
  </div>
  }
</ocx-portal-page>
