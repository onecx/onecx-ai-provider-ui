<form [formGroup]="formGroup">
  <div class="flex flex-wrap flex-column gap-4 justify-content-between mt-2">
    <div [title]="'AGENT_CREATE_UPDATE.FORM.NAME' | translate">
      <p-floatlabel variant="on" controlErrorAnchor>
        <input pInputText type="text" id="agent_detail_form_name" class="w-full pt-3 pb-2" formControlName="name" />
        <label class="ocx-required-label" for="agent_detail_form_name">
          {{ 'AGENT_CREATE_UPDATE.FORM.NAME' | translate }}</label
        >
      </p-floatlabel>
    </div>

    <div [title]="'AGENT_CREATE_UPDATE.FORM.DESCRIPTION' | translate">
      <p-floatlabel variant="on" controlErrorAnchor>
        <input
          pInputText
          type="text"
          id="agent_detail_form_description"
          class="w-full pt-3 pb-2"
          formControlName="description"
          [attr.aria-label]="'AGENT_CREATE_UPDATE.FORM.DESCRIPTION' | translate"
        />
        <label for="agent_detail_form_description"> {{ 'AGENT_CREATE_UPDATE.FORM.DESCRIPTION' | translate }}</label>
      </p-floatlabel>
    </div>

    <div [title]="'AGENT_CREATE_UPDATE.FORM.STATUS' | translate">
      <p-floatlabel variant="on" controlErrorAnchor>
        <p-select
          inputId="agent_detail_form_status"
          formControlName="status"
          [options]="statusOptions"
          appendTo="body"
          class="w-full"
          [attr.aria-label]="'AGENT_CREATE_UPDATE.FORM.STATUS' | translate"
        >
          <ng-template let-status pTemplate="item"> {{ ('AGENT_STATUS.' + status) | translate }} </ng-template>
          <ng-template let-status pTemplate="selectedItem">
            {{ status ? (('AGENT_STATUS.' + status) | translate) : '' }}
          </ng-template>
        </p-select>
        <label class="ocx-required-label" for="agent_detail_form_status">
          {{ 'AGENT_CREATE_UPDATE.FORM.STATUS' | translate }}
        </label>
      </p-floatlabel>
    </div>
  </div>
</form>
