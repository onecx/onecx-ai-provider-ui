<form [formGroup]="formGroup">
  <div class="flex flex-column gap-4 mt-2">
    <p-floatlabel variant="on">
      <input pInputText id="model_identifier" class="w-full pt-3 pb-2" formControlName="modelIdentifier" />
      <label class="ocx-required-label" for="model_identifier">
        {{ 'PROVIDER_DETAILS.MODELS.MODEL_IDENTIFIER' | translate }}
      </label>
    </p-floatlabel>

    @if (isOpenAi) {
      @if (hasLegacyModelConfigWarning) {
        <p role="status" class="text-orange-500">
          {{ 'PROVIDER_DETAILS.MODELS.LEGACY_CONFIG_WARNING' | translate }}
        </p>
      }

      <p-floatlabel variant="on">
        <select id="model_api" class="p-inputtext w-full pt-3 pb-2" formControlName="api">
          @for (api of apiOptions; track api) {
            <option [value]="api">{{ 'PROVIDER_DETAILS.MODELS.API_OPTIONS.' + api | translate }}</option>
          }
        </select>
        <label for="model_api">{{ 'PROVIDER_DETAILS.MODELS.API' | translate }}</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input pInputText id="model_reasoning_effort" class="w-full pt-3 pb-2" formControlName="reasoningEffort" />
        <label for="model_reasoning_effort">
          {{ 'PROVIDER_DETAILS.MODELS.REASONING_EFFORT' | translate }}
        </label>
      </p-floatlabel>

      @if (configurationTooLong) {
        <p role="alert" class="text-red-500">
          {{ 'PROVIDER_DETAILS.MODELS.CONFIGURATION_TOO_LONG' | translate }}
        </p>
      }
    }
  </div>
</form>
